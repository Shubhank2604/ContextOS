name: LongBench comparison (manual)

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model identifier
        required: true
        type: string
      profile:
        description: Deterministic LongBench subset profile
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard
          - full
      context_budget_tokens:
        description: Shared constrained-strategy context budget
        required: true
        default: "8192"
        type: string
      max_context_tokens:
        description: Declared model context limit including output
        required: true
        default: "32768"
        type: string

permissions:
  contents: read

jobs:
  longbench-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[benchmark,openai]"
      - name: Prepare pinned external subset
        run: >-
          contextos benchmark longbench prepare
          --profile "${{ inputs.profile }}"
          --output benchmark-output/prepared.json
      - name: Run explicitly requested paid-provider comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          contextos benchmark longbench run
          --prepared benchmark-output/prepared.json
          --output benchmark-output/predictions.jsonl
          --model "${{ inputs.model }}"
          --context-budget-tokens "${{ inputs.context_budget_tokens }}"
          --max-context-tokens "${{ inputs.max_context_tokens }}"
      - name: Score complete comparison
        run: >-
          contextos benchmark longbench score
          --prepared benchmark-output/prepared.json
          --predictions benchmark-output/predictions.jsonl
          --output benchmark-output/scores.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longbench-${{ github.run_id }}
          path: benchmark-output/
          if-no-files-found: warn
