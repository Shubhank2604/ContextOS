[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos-runtime"
version = "0.1.0"
description = "A model-agnostic runtime for constructing LLM context under a token budget."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shubhank Chandak" }]
dependencies = [
    "numpy>=1.26,<2.5",
    "pydantic>=2,<3",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]
openai = ["openai>=1"]
benchmark = [
    "datasets>=3",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scipy>=1.11",
]
dev = [
    "hypothesis>=6",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
contextos = "contextos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=contextos --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["contextos"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.',
    "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ContextOS_MASTER_BUILD_PROMPT.md", "MASTER_BUILD_SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/contextos/models.py" = ["UP042"]
"tests/**" = ["S101"]
